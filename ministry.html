<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منصة عون · وزارة الصحة</title>
<meta name="theme-color" content="#2F7F80"><link rel="icon" href="img/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Reem+Kufi:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF5F4}
a{color:#2F7F80}a:hover{color:#1F5D5E}
button{font-family:inherit}
@keyframes aounIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes aounFeed{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes aounPulse{0%{box-shadow:0 0 0 0 rgba(47,163,127,.55)}100%{box-shadow:0 0 0 10px rgba(47,163,127,0)}}
.aoun-in{animation:aounIn .5s cubic-bezier(.2,.7,.2,1)}
.aoun-feed{animation:aounFeed .45s ease-out}
.aoun-live{animation:aounPulse 1.6s ease-out infinite}
.aoun-region:hover{filter:brightness(.93)}
.aoun-hex:hover{filter:brightness(.93)}
@media (prefers-reduced-motion: reduce){.aoun-in,.aoun-feed,.aoun-live{animation:none}}
</style>

<style>
  /* iOS feel: system font, press feedback, no web focus glow, smooth scroll */
  html, body { -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button, a.ios-btn { font-family: inherit !important; -webkit-appearance: none; touch-action: manipulation; transition: opacity .12s ease, transform .12s ease; }
  button:active, a.ios-btn:active { opacity: .55; }
  button:focus-visible, a.ios-btn:focus-visible { outline: 3px solid #96D7C6; outline-offset: 2px; }
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }
</style>

<style>html,body{margin:0;padding:0}#dc-root{min-height:100dvh}</style>
</head><body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div dir="rtl" style="min-height: 100vh; box-sizing: border-box; display: flex; flex-wrap: wrap; font-family: -apple-system, BlinkMacSystemFont, 'SF Arabic', 'SF Pro Text', 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #173F42; background: linear-gradient(160deg, #F4F9F8 0%, #E6F0EE 100%); font-size: 15px">

  <aside style="flex: 1 1 220px; max-width: 100%; box-sizing: border-box; background: linear-gradient(180deg, #2F7F80 0%, #1F5D5E 100%); color: #FFFFFF; padding: 26px 16px; display: flex; flex-direction: column; gap: 26px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 6px">
      <div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px">
        <div dir="ltr" style="display: flex; align-items: center; gap: 2px; background: #FFFFFF; border-radius: 16px; padding: 6px 16px 6px 8px">
          <img src="img/ministry-logo.png" alt="" style="width: 44px; height: 44px">
          <span style="font-family: 'Reem Kufi', sans-serif; font-weight: 700; font-size: 30px; line-height: 1; color: #2F7F80">عون</span>
        </div>
        <span style="font-size: 12px; color: #D5EFE7">منصة وزارة الصحة</span>
      </div>
    </div>
    <nav aria-label="أقسام المنصة" style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="4">
        <button onClick="{{tb.pick}}" aria-current="{{tb.current}}" style="text-align: right; min-height: 50px; border-radius: 14px; border: none; padding: 0 14px; background: {{tb.bg}}; color: #FFFFFF; font-size: 15px; font-weight: {{tb.weight}}; display: flex; align-items: center; gap: 12px; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tb.d}}"></path></svg>
          {{tb.label}}
        </button>
      </sc-for>
    </nav>
    <div style="margin-top: auto; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 8px"><span class="aoun-live" style="width: 10px; height: 10px; border-radius: 5px; background: #6FE0B5"></span><b style="font-size: 13px">رفيدة تعمل الآن</b></div>
      <span style="font-size: 12px; line-height: 1.7; color: #D5EFE7">{{liveCount}} محادثة جارية مع المستفيدين في كل المناطق</span>
    </div>
    <div style="font-size: 11px; line-height: 1.7; color: #C4E3DC; padding: 0 6px">كل الأرقام مجمّعة ومجهّلة، ولا تُعرض أي مجموعة أقل من 50 شخصًا.</div>
  </aside>

  <main style="flex: 999 1 600px; min-width: 0; box-sizing: border-box; padding: 26px clamp(14px, 2.6vw, 34px); display: flex; flex-direction: column; gap: 18px">

    <header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; background: rgba(255,255,255,.75); border: 1px solid #FFFFFF; border-radius: 22px; padding: 16px 20px; box-shadow: 0 6px 24px rgba(11,110,79,.06)">
      <div style="display: flex; align-items: center; gap: 14px">
        <div style="width: 52px; height: 52px; border-radius: 16px; background: #E6F4F1; color: #2F7F80; display: flex; align-items: center; justify-content: center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"></path><path d="M9 3v15M15 6v15"></path></svg>
        </div>
        <div>
          <h1 style="margin: 0; font-size: 24px">منصة عون · الكشف المبكر والوقاية</h1>
          <nav aria-label="المسار" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 13px; margin-top: 2px">
            <sc-for list="{{crumbs}}" as="cr" hint-placeholder-count="2">
              <span style="display: flex; align-items: center; gap: 4px">
                <button onClick="{{cr.go}}" style="border: none; background: transparent; padding: 4px 2px; min-height: 30px; color: {{cr.color}}; font-weight: {{cr.weight}}; font-size: 13px; cursor: pointer">{{cr.label}}</button>
                <sc-if value="{{cr.sep}}" hint-placeholder-val="{{ true }}"><span style="color: #8BA096">‹</span></sc-if>
              </span>
            </sc-for>
          </nav>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
        <div role="group" aria-label="الفترة" style="display: flex; background: #E6F4F1; border-radius: 12px; padding: 4px">
          <sc-for list="{{ranges}}" as="rg" hint-placeholder-count="3">
            <button onClick="{{rg.pick}}" aria-pressed="{{rg.selected}}" style="min-height: 36px; padding: 0 12px; border: none; border-radius: 9px; background: {{rg.bg}}; color: {{rg.color}}; font-size: 13px; font-weight: 600; cursor: pointer">{{rg.label}}</button>
          </sc-for>
        </div>
        <span style="font-size: 12px; font-weight: 600; background: #FBF5D6; color: #6B5A08; padding: 8px 12px; border-radius: 12px">بيانات تجريبية للعرض</span>
      </div>
    </header>

    <sc-if value="{{notSettings}}" hint-placeholder-val="{{ true }}">
    <!-- KPIs -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 12px">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="6">
        <div style="background: rgba(255,255,255,.85); border: 1px solid #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 6px 20px rgba(11,110,79,.05)">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="font-size: 13px; color: #4C6466; font-weight: 500">{{k.label}}</span>
            <span style="width: 34px; height: 34px; border-radius: 11px; background: #E6F4F1; color: #2F7F80; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{k.d}}"></path></svg></span>
          </div>
          <span style="font-size: 30px; font-weight: 700; color: #173F42; line-height: 1.1">{{k.value}}</span>
          <span style="font-size: 12px; font-weight: 600; color: {{k.subColor}}">{{k.sub}}</span>
        </div>
      </sc-for>
    </div>
    </sc-if>

    <!-- ================= الرئيسية ================= -->
    <sc-if value="{{is.home}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: stretch">

          <section style="flex: 1.7 1 520px; min-width: 0; background: rgba(255,255,255,.88); border: 1px solid #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 28px rgba(11,110,79,.07)">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap">
              <div>
                <h2 style="margin: 0; font-size: 19px">{{mapTitle}}</h2>
                <span style="font-size: 12px; color: #4C6466">{{mapHint}}</span>
              </div>
              <sc-if value="{{canBack}}" hint-placeholder-val="{{ false }}">
                <button onClick="{{back}}" style="min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid #CFE2DF; background: #FFFFFF; color: #2F7F80; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
                  تصغير
                </button>
              </sc-if>
            </div>

            <div style="position: relative; border-radius: 18px; background: radial-gradient(ellipse at 50% 40%, #F7FBFA 0%, #E3F0ED 100%); overflow: hidden">
              <sc-if value="{{showKingdomMap}}" hint-placeholder-val="{{ true }}">
                <div style="position: relative; width: 100%; aspect-ratio: 730 / 600">
                  <svg viewBox="0 0 730 600" role="img" aria-label="خريطة مناطق المملكة ملونة حسب نسبة إكمال الفحوصات" style="position: absolute; inset: 0; width: 100%; height: 100%">
                    <g style="transform: {{mapT}}; transform-origin: 0 0; transition: transform .8s cubic-bezier(.2,.7,.2,1)">
                      <sc-for list="{{regionShapes}}" as="r" hint-placeholder-count="13">
                        <path class="aoun-region" d="{{r.d}}" fill="{{r.fill}}" stroke="#FFFFFF" stroke-width="1.6" vector-effect="non-scaling-stroke" opacity="{{r.op}}" onClick="{{r.pick}}" onMouseEnter="{{r.enter}}" onMouseLeave="{{leave}}" style="cursor: pointer; transition: opacity .5s, fill .4s"></path>
                      </sc-for>
                    </g>
                  </svg>
                  <sc-for list="{{regionLabels}}" as="l" hint-placeholder-count="13">
                    <span style="position: absolute; left: {{l.left}}; top: {{l.top}}; transform: translate(-50%, -50%); pointer-events: none; font-size: {{l.fs}}; font-weight: 700; color: #173F42; background: rgba(255,255,255,.85); padding: 2px 9px; border-radius: 10px; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.08)">{{l.name}}</span>
                  </sc-for>
                  <sc-for list="{{cityPins}}" as="c" hint-placeholder-count="4">
                    <button class="aoun-in" onClick="{{c.pick}}" onMouseEnter="{{c.enter}}" onMouseLeave="{{leave}}" style="position: absolute; left: {{c.left}}; top: {{c.top}}; transform: {{c.tf}}; display: flex; flex-direction: {{c.dir}}; align-items: center; gap: 3px; border: none; background: transparent; padding: 0; cursor: pointer; z-index: 2">
                      <span style="background: #FFFFFF; border-radius: 12px; padding: 5px 10px; font-size: 13px; font-weight: 700; color: #173F42; box-shadow: 0 3px 10px rgba(0,0,0,.15); display: flex; align-items: center; gap: 6px; white-space: nowrap">{{c.name}}<span style="background: {{c.fill}}; color: {{c.ink}}; border-radius: 8px; padding: 0 7px">{{c.pct}}%</span></span>
                      <span style="width: 16px; height: 16px; border-radius: 8px; background: #2F7F80; border: 3px solid #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,.3); box-sizing: border-box"></span>
                    </button>
                  </sc-for>
                </div>
              </sc-if>
              <sc-if value="{{geoLoading}}" hint-placeholder-val="{{ false }}">
                <div style="aspect-ratio: 730 / 600; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #4C6466">جاري تحميل الخريطة…</div>
              </sc-if>

              <sc-if value="{{showCityMap}}" hint-placeholder-val="{{ false }}">
                <div class="aoun-in" style="position: relative; width: 100%; aspect-ratio: 800 / 560; background: #F1EEE8; overflow: hidden">
                  <svg viewBox="0 0 800 560" role="img" aria-label="خريطة أحياء المدينة" style="position: absolute; inset: 0; width: 100%; height: 100%">
                    <defs>
                      <pattern id="aounStreets" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(14)"><path d="M0 0H20M0 0V20" stroke="#FFFFFF" stroke-width="1.3" fill="none"></path></pattern>
                    </defs>
                    <g style="transform: {{cityT}}; transform-origin: 0 0; transition: transform .8s cubic-bezier(.2,.7,.2,1)">
                      <rect x="-600" y="-600" width="2000" height="1760" fill="#F1EEE8"></rect>
                      <sc-for list="{{cells}}" as="cl" hint-placeholder-count="12">
                        <path d="{{cl.d}}" fill="{{cl.fill}}" fill-opacity="{{cl.op}}" stroke="none" onClick="{{cl.pick}}" onMouseEnter="{{cl.enter}}" onMouseLeave="{{leave}}" style="cursor: pointer; transition: fill-opacity .4s"></path>
                      </sc-for>
                      <rect x="-600" y="-600" width="2000" height="1760" fill="url(#aounStreets)" style="pointer-events: none"></rect>
                      <sc-for list="{{parks}}" as="pk" hint-placeholder-count="3">
                        <ellipse cx="{{pk.cx}}" cy="{{pk.cy}}" rx="{{pk.rx}}" ry="{{pk.ry}}" fill="#C6E6BD" style="pointer-events: none"></ellipse>
                      </sc-for>
                      <sc-for list="{{cells}}" as="cl" hint-placeholder-count="12">
                        <path d="{{cl.d}}" fill="none" stroke="#FFFFFF" stroke-width="5" vector-effect="non-scaling-stroke" stroke-linejoin="round" style="pointer-events: none"></path>
                      </sc-for>
                      <path d="{{roads.ring}}" fill="none" stroke="#F2C14E" stroke-width="9" vector-effect="non-scaling-stroke" style="pointer-events: none"></path>
                      <path d="{{roads.ring}}" fill="none" stroke="#FDE293" stroke-width="6" vector-effect="non-scaling-stroke" style="pointer-events: none"></path>
                      <path d="{{roads.av1}}" fill="none" stroke="#F2C14E" stroke-width="8" vector-effect="non-scaling-stroke" style="pointer-events: none"></path>
                      <path d="{{roads.av1}}" fill="none" stroke="#FDE293" stroke-width="5" vector-effect="non-scaling-stroke" style="pointer-events: none"></path>
                      <path d="{{roads.av2}}" fill="none" stroke="#DADCE0" stroke-width="7" vector-effect="non-scaling-stroke" style="pointer-events: none"></path>
                      <path d="{{roads.av2}}" fill="none" stroke="#FFFFFF" stroke-width="5" vector-effect="non-scaling-stroke" style="pointer-events: none"></path>
                      <sc-if value="{{water.show}}" hint-placeholder-val="{{ false }}"><path d="{{water.d}}" fill="#AADAFF" style="pointer-events: none"></path></sc-if>
                      <path d="{{selCell}}" fill="none" stroke="#D93025" stroke-width="3" stroke-dasharray="9 6" vector-effect="non-scaling-stroke" style="pointer-events: none"></path>
                    </g>
                  </svg>
                  <sc-for list="{{healthPins}}" as="hp" hint-placeholder-count="10">
                    <span aria-hidden="true" style="position: absolute; left: {{hp.left}}; top: {{hp.top}}; transform: translate(-50%, -50%); width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF; border: 2px solid #2F7F80; display: flex; align-items: center; justify-content: center; pointer-events: none; transition: left .8s cubic-bezier(.2,.7,.2,1), top .8s cubic-bezier(.2,.7,.2,1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#2F7F80" stroke-width="4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
                  </sc-for>
                  <sc-for list="{{cityLabels}}" as="cl" hint-placeholder-count="12">
                    <span style="position: absolute; left: {{cl.left}}; top: {{cl.top}}; transform: translate(-50%, -50%); opacity: {{cl.op}}; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: left .8s cubic-bezier(.2,.7,.2,1), top .8s cubic-bezier(.2,.7,.2,1), opacity .4s">
                      <span style="font-size: {{cl.fs}}; font-weight: 700; color: #3C4043; text-shadow: 0 0 3px #FFFFFF, 0 0 3px #FFFFFF, 0 0 3px #FFFFFF; white-space: nowrap">{{cl.name}}</span>
                      <span style="font-size: 11px; font-weight: 700; background: {{cl.fill}}; color: {{cl.ink}}; padding: 0 7px; border-radius: 8px; border: 1px solid #FFFFFF">{{cl.pct}}%</span>
                    </span>
                  </sc-for>
                  <sc-for list="{{pois}}" as="po" hint-placeholder-count="5">
                    <span class="aoun-in" style="position: absolute; left: {{po.left}}; top: {{po.top}}; transform: translate(-50%, -100%); pointer-events: none; display: flex; flex-direction: column; align-items: center">
                      <span style="display: flex; align-items: center; gap: 5px; background: #FFFFFF; border-radius: 12px; padding: 3px 8px 3px 4px; box-shadow: 0 2px 8px rgba(0,0,0,.2); font-size: 11.5px; font-weight: 600; color: #202124; white-space: nowrap">
                        <span style="width: 20px; height: 20px; border-radius: 10px; background: {{po.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{po.d}}"></path></svg></span>
                        {{po.label}}
                      </span>
                      <span style="width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid #FFFFFF"></span>
                    </span>
                  </sc-for>

                  <div style="position: absolute; top: 12px; right: 12px; left: 12px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; pointer-events: none">
                    <label style="pointer-events: auto; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 24px; padding: 0 14px; height: 44px; box-shadow: 0 2px 8px rgba(0,0,0,.18); min-width: 220px">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
                      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">ابحث عن حي</span>
                      <input placeholder="ابحث عن حي في {{cityName}}" style="border: none; outline: none; font-family: inherit; font-size: 14px; width: 100%; background: transparent; color: #202124">
                    </label>
                    <div role="group" aria-label="طبقة الخريطة" style="pointer-events: auto; display: flex; gap: 6px; flex-wrap: wrap">
                      <sc-for list="{{layerChips}}" as="lc" hint-placeholder-count="3">
                        <button onClick="{{lc.pick}}" aria-pressed="{{lc.selected}}" style="height: 36px; padding: 0 12px; border-radius: 18px; border: none; background: {{lc.bg}}; color: {{lc.ink}}; font-size: 12.5px; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,.15); cursor: pointer">{{lc.label}}</button>
                      </sc-for>
                    </div>
                  </div>
                  <div style="position: absolute; bottom: 14px; left: 14px; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.2); overflow: hidden">
                    <button onClick="{{zoomIn}}" aria-label="تكبير" style="width: 40px; height: 40px; border: none; background: #FFFFFF; font-size: 22px; color: #5F6368; cursor: pointer; border-bottom: 1px solid #E8EAED">+</button>
                    <button onClick="{{zoomOut}}" aria-label="تصغير" style="width: 40px; height: 40px; border: none; background: #FFFFFF; font-size: 22px; color: #5F6368; cursor: pointer">−</button>
                  </div>
                  <div style="position: absolute; bottom: 14px; right: 14px; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.85); border-radius: 6px; padding: 3px 8px; font-size: 11px; color: #3C4043">
                    <span style="width: 50px; height: 6px; border: 2px solid #3C4043; border-top: none; box-sizing: border-box"></span>{{scaleText}}
                  </div>
                </div>
              </sc-if>
              <sc-if value="{{tip.show}}" hint-placeholder-val="{{ false }}">
                <div role="tooltip" style="position: absolute; left: {{tip.left}}; top: {{tip.top}}; transform: {{tip.tf}}; width: 260px; pointer-events: none; background: rgba(16,36,28,.95); color: #FFFFFF; border-radius: 16px; padding: 12px 14px; box-shadow: 0 12px 32px rgba(0,0,0,.28); display: flex; flex-direction: column; gap: 6px; z-index: 5; text-align: right">
                  <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><b style="font-size: 15px">{{tip.name}}</b><b style="font-size: 20px; color: #8FE3BE">{{tip.pct}}%</b></div>
                  <span style="font-size: 12px; line-height: 1.6; color: #D5EFE7">{{tip.brief}}</span>
                  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 8px; font-size: 11.5px; color: #FFFFFF">
                    <span>المستحقون: <b>{{tip.elig}}</b></span><span>قبل عون: <b>{{tip.before}}%</b></span>
                    <span>اكتشاف مبكر: <b>{{tip.early}}</b></span><span>متأخرون: <b>{{tip.late}}</b></span>
                  </div>
                  <span style="font-size: 11.5px; color: #FCD9A0; line-height: 1.6">العائق الأبرز: {{tip.barrier}} · الأكثر شيوعًا: {{tip.gap}}</span>
                  <span style="font-size: 11px; color: #A9D8C3">{{tip.hint}}</span>
                </div>
              </sc-if>
            </div>

            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center">
              <div style="display: flex; gap: 4px; align-items: center; font-size: 11px; color: #4C6466; flex-wrap: wrap">
                <span>{{legendLo}}</span>
                <sc-for list="{{legend}}" as="lg" hint-placeholder-count="5">

<style>
body{margin:0}
a{color:#2F7F80}a:hover{color:#173F42}
button{font-family:inherit}
@keyframes rufPulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.55);opacity:0}}
@keyframes rufBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes rufWave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes rufTap{0%{box-shadow:0 0 0 0 rgba(69,150,181,.7)}100%{box-shadow:0 0 0 18px rgba(69,150,181,0)}}
@keyframes rufIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rufLoc{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}
@keyframes rufDash{to{stroke-dashoffset:-40}}
@keyframes rufFlipA{from{opacity:.3;transform:perspective(900px) rotateY(-18deg)}to{opacity:1;transform:none}}
@keyframes rufFlipB{from{opacity:.3;transform:perspective(900px) rotateY(-18deg)}to{opacity:1;transform:none}}
@keyframes rufFlipC{from{opacity:.3;transform:perspective(900px) rotateY(-18deg)}to{opacity:1;transform:none}}
@keyframes rufBlink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.15)}}
.ruf-ring{position:absolute;inset:0;border-radius:50%;border:3px solid #96D7C6;animation:rufPulse 1.6s ease-out infinite}
.ruf-ring2{animation-delay:.8s}
.ruf-orb{animation:rufBreath 3s ease-in-out infinite}
.ruf-bar{display:inline-block;width:3px;height:16px;border-radius:2px;background:#FFFFFF;transform-origin:center;animation:rufWave 1s ease-in-out infinite}
.ruf-tap{animation:rufTap .9s ease-out 2;border-radius:16px}
.ruf-in{animation:rufIn .35s ease-out}
.ruf-loc{position:absolute;inset:0;border-radius:50%;background:#2F7F80;animation:rufLoc 1.8s ease-out infinite}
.ruf-route{animation:rufDash 1.2s linear infinite}
.ruf-pa{transform-origin:right center;animation:rufFlipA .5s ease-out}
.ruf-pb{transform-origin:right center;animation:rufFlipB .5s ease-out}
.ruf-pc{transform-origin:right center;animation:rufFlipC .5s ease-out}
@keyframes rufFlipD{from{opacity:.3;transform:perspective(900px) rotateY(-18deg)}to{opacity:1;transform:none}}
.ruf-pd{transform-origin:right center;animation:rufFlipD .5s ease-out}
.ruf-eye{transform-box:fill-box;transform-origin:center;animation:rufBlink 4s infinite}
@keyframes hoodCloud{from{transform:translateX(-120px)}to{transform:translateX(480px)}}
@keyframes hoodWalk{0%{transform:translateX(-30px)}100%{transform:translateX(420px)}}
@keyframes hoodStep{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes hoodSun{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes hoodBird{from{transform:translate(-40px,0)}to{transform:translate(440px,-30px)}}
@keyframes hoodSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.hood-cloud{animation:hoodCloud 70s linear infinite}
.hood-cloud2{animation:hoodCloud 95s linear infinite;animation-delay:-40s}
.hood-walk{animation:hoodWalk 38s linear infinite}
.hood-step{animation:hoodStep .6s ease-in-out infinite}
.hood-sun{transform-box:fill-box;transform-origin:center;animation:hoodSun 6s ease-in-out infinite}
.hood-bird{animation:hoodBird 26s linear infinite}
.hood-sway{transform-box:fill-box;transform-origin:bottom center;animation:hoodSway 5s ease-in-out infinite}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid #96D7C6;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.ruf-ring,.ruf-orb,.ruf-bar,.ruf-tap,.ruf-in,.ruf-loc,.ruf-route,.ruf-pa,.ruf-pb,.ruf-pc,.ruf-eye,.hood-cloud,.hood-cloud2,.hood-walk,.hood-step,.hood-sun,.hood-bird,.hood-sway{animation:none}}
</style>

<style>
  /* iOS feel: system font, press feedback, no web focus glow, smooth scroll */
  html, body { -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button, a.ios-btn { font-family: inherit !important; -webkit-appearance: none; touch-action: manipulation; transition: opacity .12s ease, transform .12s ease; }
  button:active, a.ios-btn:active { opacity: .55; }
  button:focus-visible, a.ios-btn:focus-visible { outline: 3px solid #96D7C6; outline-offset: 2px; }
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }
</style>

<style>html,body{margin:0;padding:0}#dc-root{min-height:100dvh}</style>
</head><body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div dir="{{dir}}" lang="{{langCode}}" style="position: relative; width: 100%; max-width: 520px; margin: 0 auto; height: 100dvh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; font-family: -apple-system, BlinkMacSystemFont, 'SF Arabic', 'SF Pro Text', 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: {{fs}}px; background: {{t.bg}}; color: {{t.ink}}">

  <header style="flex: 0 0 60px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: {{t.card}}; border-bottom: 1px solid {{t.line}}">
    <div dir="ltr" style="display: flex; align-items: center; gap: 0; background: #FFFFFF; border-radius: 12px; padding: 2px 10px 2px 4px">
      <img src="img/mark.png" alt="" style="width: 40px; height: 40px; display: block">
      <img src="img/wordmark.png" alt="{{T.appName}}" style="height: 24px; width: auto; display: block; margin-left: 2px">
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <sc-if value="{{located}}" hint-placeholder-val="{{ true }}">
        <span style="min-height: 44px; padding: 0 12px; border-radius: 18px; background: {{t.soft}}; color: {{t.primary}}; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px">
          <span style="width: 8px; height: 8px; border-radius: 4px; background: #2F7F80; box-shadow: 0 0 0 3px rgba(51,126,159,.25)"></span>
          {{myHood.name}}
        </span>
      </sc-if>
      <button onClick="{{goAccess}}" aria-label="{{T.access}}" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid {{t.line}}; background: {{t.card}}; color: {{t.primary}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="1.8"></circle><path d="M5 8.5l7 1.2 7-1.2M12 9.7v4.8l-3 6.5M12 14.5l3 6.5"></path></svg>
      </button>
    </div>
  </header>

  <sc-if value="{{showScene}}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 60px; bottom: 130px; pointer-events: none; overflow: hidden; z-index: 0; background: linear-gradient(180deg, #F3F8F6 0%, #FBF8F2 55%)">
      <svg viewBox="0 0 390 250" preserveAspectRatio="xMidYMax slice" style="position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 250px">
        <circle class="hood-sun" cx="318" cy="58" r="24" fill="#F8E6BC"></circle>
        <circle cx="318" cy="58" r="36" fill="#F8E6BC" opacity="0.35"></circle>
        <g class="hood-cloud"><ellipse cx="40" cy="44" rx="26" ry="10" fill="#FFFFFF"></ellipse><ellipse cx="58" cy="38" rx="18" ry="11" fill="#FFFFFF"></ellipse></g>
        <g class="hood-cloud2"><ellipse cx="0" cy="78" rx="22" ry="8" fill="#FFFFFF" opacity="0.9"></ellipse><ellipse cx="14" cy="73" rx="14" ry="9" fill="#FFFFFF" opacity="0.9"></ellipse></g>
        <g class="hood-bird" fill="none" stroke="#B8C7C1" stroke-width="1.6" stroke-linecap="round"><path d="M10 96 q5 -5 10 0 q5 -5 10 0"></path><path d="M30 86 q4 -4 8 0 q4 -4 8 0"></path></g>

        <path d="M0 190 C80 178 160 186 230 180 C300 174 350 182 390 178 L390 250 L0 250 Z" fill="#E9F1E6"></path>

        <g fill="#E8DCC6">
          <rect x="14" y="132" width="62" height="70"></rect>
          <polygon points="14,132 14,126 20,120 26,126 32,120 38,126 44,120 50,126 56,120 62,126 68,120 76,126 76,132"></polygon>
        </g>
        <rect x="26" y="146" width="10" height="12" rx="2" fill="#D3C3A3"></rect><rect x="52" y="146" width="10" height="12" rx="2" fill="#D3C3A3"></rect>
        <path d="M40 202 V182 a6 6 0 0 1 12 0 V202 Z" fill="#C9B18A"></path>

        <g fill="#EFE5D3">
          <rect x="84" y="150" width="50" height="52"></rect>
          <polygon points="84,150 84,145 90,139 96,145 102,139 108,145 114,139 120,145 126,139 134,145 134,150"></polygon>
        </g>
        <rect x="94" y="162" width="9" height="11" rx="2" fill="#D9CAAB"></rect><rect x="116" y="162" width="9" height="11" rx="2" fill="#D9CAAB"></rect>

        <g fill="#E1EEE9">
          <rect x="150" y="146" width="74" height="56"></rect>
          <path d="M162 146 a25 25 0 0 1 50 0 Z"></path>
          <rect x="230" y="98" width="12" height="104"></rect>
          <path d="M226 98 h20 l-10 -14 Z"></path>
        </g>
        <circle cx="187" cy="116" r="3" fill="#B9D6CC"></circle>
        <path d="M178 202 V180 a9 9 0 0 1 18 0 V202 Z" fill="#B9D6CC"></path>
        <rect x="233" y="112" width="6" height="4" rx="1" fill="#B9D6CC"></rect>

        <g fill="#EADFCB">
          <rect x="262" y="140" width="58" height="62"></rect>
          <polygon points="262,140 262,134 268,128 274,134 280,128 286,134 292,128 298,134 304,128 310,134 316,128 320,134 320,140"></polygon>
        </g>
        <rect x="272" y="152" width="10" height="12" rx="2" fill="#D3C3A3"></rect><rect x="298" y="152" width="10" height="12" rx="2" fill="#D3C3A3"></rect>

        <g class="hood-sway">
          <path d="M346 202 C344 180 345 160 350 140" fill="none" stroke="#CDB894" stroke-width="5" stroke-linecap="round"></path>
          <g fill="#BEDCC6"><ellipse cx="338" cy="138" rx="16" ry="5" transform="rotate(-25 338 138)"></ellipse><ellipse cx="362" cy="138" rx="16" ry="5" transform="rotate(25 362 138)"></ellipse><ellipse cx="342" cy="130" rx="14" ry="4.5" transform="rotate(-60 342 130)"></ellipse><ellipse cx="358" cy="130" rx="14" ry="4.5" transform="rotate(60 358 130)"></ellipse></g>
        </g>
        <g class="hood-sway">
          <path d="M140 204 C139 190 140 178 143 166" fill="none" stroke="#CDB894" stroke-width="4" stroke-linecap="round"></path>
          <g fill="#C8E2CF"><ellipse cx="135" cy="165" rx="12" ry="4" transform="rotate(-25 135 165)"></ellipse><ellipse cx="152" cy="165" rx="12" ry="4" transform="rotate(25 152 165)"></ellipse><ellipse cx="139" cy="159" rx="10" ry="3.5" transform="rotate(-60 139 159)"></ellipse><ellipse cx="149" cy="159" rx="10" ry="3.5" transform="rotate(60 149 159)"></ellipse></g>
        </g>

        <rect x="0" y="202" width="390" height="22" fill="#E6DECD"></rect>
        <path d="M0 213 H390" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="12 10"></path>
        <rect x="0" y="224" width="390" height="26" fill="#EEF4EC"></rect>

        <rect x="248" y="170" width="3" height="34" fill="#B9A688"></rect>
        <rect x="226" y="160" width="48" height="16" rx="4" fill="#2F7F80" opacity="0.85"></rect>

        <g class="hood-walk">
          <g class="hood-step">
            <circle cx="10" cy="187" r="3.6" fill="#7FA99A"></circle>
            <path d="M10 191 V202 M10 202 l-3 6 M10 202 l3 6 M10 194 l-4 4 M10 194 l4 3" fill="none" stroke="#7FA99A" stroke-width="2" stroke-linecap="round"></path>
          </g>
        </g>
      </svg>
      <span style="position: absolute; bottom: {{signBottom}}; left: 64.1%; transform: translateX(-50%); font-size: 11px; font-weight: 700; color: #FFFFFF; white-space: nowrap; line-height: 16px">{{myHood.name}}</span>
    </div>
  </sc-if>

  <main style="position: relative; z-index: 1; flex: 1 1 auto; overflow-y: auto; box-sizing: border-box; padding: 14px 16px 18px">

    <!-- ===================== تحديد الحي من الموقع ===================== -->
    <sc-if value="{{is.locate}}" hint-placeholder-val="{{ false }}">
      <div class="ruf-in" style="display: flex; flex-direction: column; gap: 14px">
        <div style="border-radius: 26px; padding: 20px; background: linear-gradient(160deg, #2F7F80 0%, #6C8CBF 100%); color: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 1.4em; font-weight: 700">{{T.welcomeT}}</span>
          <span style="font-size: 0.86em; line-height: 1.7; color: #D9F2EB">{{T.welcomeS}}</span>
        </div>

        <div style="position: relative; width: 100%; aspect-ratio: 340 / 220; border-radius: 22px; overflow: hidden; background: #F1EEE8; border: 1px solid {{t.line}}">
          <svg viewBox="0 0 340 220" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%">
            <defs><pattern id="rufStreets1" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(12)"><path d="M0 0H18M0 0V18" stroke="#FFFFFF" stroke-width="1.4" fill="none"></path></pattern></defs>
            <rect x="0" y="0" width="340" height="220" fill="#F1EEE8"></rect>
            <rect x="0" y="0" width="340" height="220" fill="url(#rufStreets1)"></rect>
            <path d="M-10 150 C80 130 160 170 350 120" fill="none" stroke="#E2D36B" stroke-width="9"></path>
            <path d="M-10 150 C80 130 160 170 350 120" fill="none" stroke="#F1E7A6" stroke-width="6"></path>
            <path d="M120 -10 L150 230" fill="none" stroke="#FFFFFF" stroke-width="7"></path>
            <ellipse cx="250" cy="60" rx="38" ry="22" fill="#DCE6A6"></ellipse>
            <path d="M60 30 L200 20 L230 110 L120 125 Z" fill="{{locFill}}" fill-opacity="0.35" stroke="#D93025" stroke-width="2" stroke-dasharray="6 4"></path>
          </svg>
          <sc-if value="{{locating}}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; left: 44%; top: 34%; width: 22px; height: 22px; transform: translate(-50%, -50%)"><span class="ruf-loc"></span></span>
          </sc-if>
          <span style="position: absolute; left: 44%; top: 34%; width: 16px; height: 16px; border-radius: 8px; background: #6C8CBF; border: 3px solid #FFFFFF; box-shadow: 0 0 0 6px rgba(26,115,232,.2); transform: translate(-50%, -50%); box-sizing: border-box"></span>
          <sc-if value="{{located}}" hint-placeholder-val="{{ false }}">
            <span class="ruf-in" style="position: absolute; left: 44%; top: 16%; transform: translate(-50%, -50%); background: #FFFFFF; border-radius: 12px; padding: 4px 10px; font-size: 12px; font-weight: 700; color: #202124; box-shadow: 0 2px 8px rgba(0,0,0,.18); white-space: nowrap">{{myHood.name}}</span>
          </sc-if>
        </div>

        <sc-if value="{{locAsk}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 10px">
            <button onClick="{{allowLoc}}" style="min-height: 50px; border-radius: 14px; border: none; background: #2F7F80; color: #FFFFFF; font-weight: 600; font-size: 1em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
              {{T.allowLoc}}
            </button>
            <span style="text-align: center; font-size: 0.74em; color: {{t.muted}}; line-height: 1.6">{{T.locPrivacy}}</span>
          </div>
        </sc-if>
        <sc-if value="{{locating}}" hint-placeholder-val="{{ false }}">
          <div style="text-align: center; font-size: 0.9em; color: {{t.muted}}">{{T.locating}}</div>
        </sc-if>
        <sc-if value="{{locFound}}" hint-placeholder-val="{{ false }}">
          <div class="ruf-in" style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
            <span style="font-size: 0.8em; color: {{t.muted}}">{{T.youAreIn}}</span>
            <div style="display: flex; justify-content: space-between; align-items: center"><b style="font-size: 1.15em">{{myHood.name}} · {{myHood.city}}</b><b style="color: #2F7F80">{{myHood.pct}}%</b></div>
            <div style="height: 10px; border-radius: 5px; background: #E3F4EF; overflow: hidden"><div style="width: {{myHood.pctW}}; height: 10px; background: #6C8CBF"></div></div>
            <span style="font-size: 0.8em; color: {{t.muted}}">{{T.neighborsDid}}</span>
            <span style="font-size: 0.84em; line-height: 1.7"><b>{{T.mostCommon}}</b> {{myHood.gap}}</span>
            <button onClick="{{startAgent}}" style="min-height: 50px; border-radius: 14px; border: none; background: #2F7F80; color: #FFFFFF; font-weight: 600; font-size: 1em; cursor: pointer">{{T.cont}}</button>
            <button onClick="{{toggleManual}}" style="min-height: 44px; border: none; background: transparent; color: {{t.primary}}; font-size: 0.8em; font-weight: 600; cursor: pointer; text-decoration: underline">{{T.notMyHood}}</button>
            <sc-if value="{{manual}}" hint-placeholder-val="{{ false }}">
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
                <sc-for list="{{hoodChips}}" as="h" hint-placeholder-count="8">
                  <button onClick="{{h.pick}}" aria-pressed="{{h.selected}}" style="min-height: 44px; border-radius: 14px; border: 1.5px solid {{h.border}}; background: {{h.bg}}; color: {{t.ink}}; font-size: 0.8em; font-weight: 600; cursor: pointer">{{h.name}}</button>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <!-- ===================== رفيدة ===================== -->
    <sc-if value="{{is.agent}}" hint-placeholder-val="{{ true }}">
      <div class="ruf-in" style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; gap: 6px; flex-wrap: wrap">
          <sc-for list="{{personaChips}}" as="p" hint-placeholder-count="4">
            <button onClick="{{p.pick}}" aria-pressed="{{p.selected}}" style="min-height: 44px; padding: 0 12px; border-radius: 14px; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: {{p.color}}; font-size: 12px; font-weight: 600; cursor: pointer">{{p.label}}</button>
          </sc-for>
        </div>
        <div style="border-radius: 26px; padding: 20px 18px 16px; background: linear-gradient(170deg, #2F7F80 0%, #173F42 100%); color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 8px">
          <button onClick="{{wake}}" aria-label="{{T.rufaida}}" style="position: relative; width: 120px; height: 120px; border-radius: 60px; border: none; padding: 0; background: transparent; cursor: pointer">
            <sc-if value="{{listening}}" hint-placeholder-val="{{ false }}"><span class="ruf-ring"></span><span class="ruf-ring ruf-ring2"></span></sc-if>
            <span class="ruf-orb" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{asstF}}" hint-placeholder-val="{{ true }}">
              <svg width="120" height="120" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47" fill="#6C8CBF"></circle><path d="M23 62 C17 30 33 15 50 15 C67 15 83 30 77 62 L76 86 C66 92 34 92 24 86 Z" fill="#3B2418"></path><path d="M38 80 C40 88 60 88 62 80 L62 92 C56 95 44 95 38 92 Z" fill="#F6DCC7"></path><path d="M28 97 C30 86 40 82 50 82 C60 82 70 86 72 97 Z" fill="#5AA7A7"></path><ellipse cx="50" cy="54" rx="22" ry="25" fill="#F6DCC7"></ellipse><path d="M27 54 C25 32 40 23 54 25 C67 27 77 38 74 54 C68 41 54 35 41 40 C34 43 30 48 27 54 Z" fill="#3B2418"></path><circle cx="69" cy="33" r="4.5" fill="#F4A58A"></circle><circle cx="69" cy="33" r="1.8" fill="#FFFFFF"></circle><path class="ruf-eye" d="M37 56 Q41.5 51 46 56M54 56 Q58.5 51 63 56M37 56 L34.5 54M63 56 L65.5 54" fill="none" stroke="#173F42" stroke-width="3.2" stroke-linecap="round"></path><circle cx="36" cy="64" r="4" fill="#F4A58A" opacity="0.65"></circle><circle cx="64" cy="64" r="4" fill="#F4A58A" opacity="0.65"></circle><path d="M44 67 Q50 73 56 67" fill="none" stroke="#C9566B" stroke-width="3.2" stroke-linecap="round"></path></svg>
              </sc-if>
              <sc-if value="{{asstM}}" hint-placeholder-val="{{ false }}">

    </sc-if>
    <sc-if value="{{asstM}}" hint-placeholder-val="{{ false }}">
    <svg width="38" height="38" viewBox="0 0 100 100" aria-hidden="true" style="flex: 0 0 auto"><circle cx="50" cy="50" r="47" fill="#FFFFFF"></circle><path d="M16 97 C17 62 25 27 50 22 C75 27 83 62 84 97 Z" fill="#EDF8F4"></path><circle cx="50" cy="58" r="27" fill="#E3F4EF"></circle><path d="M22 41 C32 24 68 24 78 41" fill="none" stroke="#173F42" stroke-width="6" stroke-linecap="round"></path><path d="M37 58 Q42 52 47 58M53 58 Q58 52 63 58" fill="none" stroke="#173F42" stroke-width="4.5" stroke-linecap="round"></path><path d="M43 68 Q50 74 57 68" fill="none" stroke="#173F42" stroke-width="4" stroke-linecap="round"></path></svg>

  <nav aria-label="{{T.navLabel}}" style="flex: 0 0 70px; box-sizing: border-box; border-top: 1px solid {{t.line}}; background: {{t.card}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 4px">

          </sc-if>
          <sc-if value="{{asstM}}" hint-placeholder-val="{{ false }}">
          <svg width="32" height="32" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47" fill="#6C8CBF"></circle><path d="M16 97 C17 62 25 27 50 22 C75 27 83 62 84 97 Z" fill="#FFFFFF"></path><circle cx="50" cy="58" r="27" fill="#E3F4EF"></circle><path d="M22 41 C32 24 68 24 78 41" fill="none" stroke="#173F42" stroke-width="7" stroke-linecap="round"></path><path d="M37 58 Q42 52 47 58M53 58 Q58 52 63 58" fill="none" stroke="#173F42" stroke-width="5" stroke-linecap="round"></path><path d="M43 68 Q50 74 57 68" fill="none" stroke="#173F42" stroke-width="4.5" stroke-linecap="round"></path></svg>
          </sc-if>
        </sc-if>
        <sc-if value="{{n.icon}}" hint-placeholder-val="{{ true }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>

        {{n.label}}

  </nav>

  <!-- ===================== المكالمة الافتتاحية ===================== -->
  <sc-if value="{{is.call}}" hint-placeholder-val="{{ true }}">
    <div role="dialog" aria-modal="true" aria-label="{{call.title}}" style="position: absolute; inset: 0; z-index: 60; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(170deg, #2F7F80 0%, #173F42 100%); color: #FFFFFF; padding: 16px 18px 22px; font-size: {{fs}}px">

      <!-- يرن -->
      <sc-if value="{{call.ring}}" hint-placeholder-val="{{ true }}">
        <div class="ruf-in" style="flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 11px; color: #CDEDE5">{{call.demoWho}}</span>
            <div style="display: flex; gap: 6px; flex-wrap: wrap">
              <sc-for list="{{call.who}}" as="w" hint-placeholder-count="3">
                <button onClick="{{w.pick}}" aria-pressed="{{w.selected}}" style="min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid {{w.border}}; background: {{w.bg}}; color: {{w.ink}}; font-size: 12px; font-weight: 600; cursor: pointer">{{w.label}}</button>

            </div>
          </div>
          <div style="align-self: center; margin-top: 14px; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.12); border-radius: 16px; padding: 6px 12px; font-size: 12px; font-weight: 600">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4DE7A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg>
            {{call.badge}}

              <span class="ruf-ring"></span><span class="ruf-ring ruf-ring2"></span>
              <div class="ruf-orb" style="position: absolute; inset: 0; border-radius: 66px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,.25)">
                <img src="img/mark.png" alt="" style="width: 96px; height: 96px; display: block">
              </div>
            </div>
            <span style="font-family: 'Reem Kufi', sans-serif; font-size: 34px; font-weight: 700; margin-top: 10px">{{call.caller}}</span>
            <span style="font-size: 0.9em; color: #D9F2EB; font-weight: 600">{{call.callerSub}}</span>
            <span role="status" style="font-size: 0.86em; color: #CDEDE5">{{call.calling}}</span>
          </div>
          <div style="background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 18px; padding: 12px 14px; font-size: 0.78em; line-height: 1.7; color: #D9F2EB">{{call.safe}}</div>

                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(135deg)"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>
              </button>
              <span style="font-size: 0.82em; font-weight: 600">{{call.declineLabel}}</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
              <button onClick="{{call.accept}}" aria-label="{{call.acceptLabel}}" class="ruf-tap" style="width: 72px; height: 72px; border-radius: 36px; border: none; background: #1E9E5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>
              </button>
              <span style="font-size: 0.82em; font-weight: 600">{{call.acceptLabel}}</span>
            </div>
          </div>
        </div>
      </sc-if>

      <!-- مكالمة جارية -->
      <sc-if value="{{call.live}}" hint-placeholder-val="{{ false }}">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="width: 34px; height: 34px; border-radius: 17px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><img src="img/mark.png" alt="" style="width: 28px; height: 28px; display: block"></span>
              <div style="display: flex; flex-direction: column"><b style="font-size: 0.9em">{{call.caller}} · {{call.ministry}}</b><span style="font-size: 0.72em; color: #CDEDE5">{{call.liveLabel}}</span></div>
            </div>
            <span dir="ltr" role="timer" style="font-variant-numeric: tabular-nums; font-size: 0.9em; font-weight: 700; color: #D4DE7A">{{call.clock}}</span>
          </div>

          <div style="display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.07); border-radius: 22px; padding: 10px 12px">
            <div style="position: relative; width: 104px; height: 104px; flex: 0 0 auto">
              <sc-if value="{{call.speaking}}" hint-placeholder-val="{{ true }}"><span class="ruf-ring"></span></sc-if>
              <sc-if value="{{call.known}}" hint-placeholder-val="{{ true }}">
                <span class="ruf-orb" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">
                  <sc-if value="{{asstF}}" hint-placeholder-val="{{ true }}">
                  <svg width="104" height="104" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47" fill="#6C8CBF"></circle><path d="M23 62 C17 30 33 15 50 15 C67 15 83 30 77 62 L76 86 C66 92 34 92 24 86 Z" fill="#3B2418"></path><path d="M38 80 C40 88 60 88 62 80 L62 92 C56 95 44 95 38 92 Z" fill="#F6DCC7"></path><path d="M28 97 C30 86 40 82 50 82 C60 82 70 86 72 97 Z" fill="#5AA7A7"></path><ellipse cx="50" cy="54" rx="22" ry="25" fill="#F6DCC7"></ellipse><path d="M27 54 C25 32 40 23 54 25 C67 27 77 38 74 54 C68 41 54 35 41 40 C34 43 30 48 27 54 Z" fill="#3B2418"></path><circle cx="69" cy="33" r="4.5" fill="#F4A58A"></circle><circle cx="69" cy="33" r="1.8" fill="#FFFFFF"></circle><path class="ruf-eye" d="M37 56 Q41.5 51 46 56M54 56 Q58.5 51 63 56M37 56 L34.5 54M63 56 L65.5 54" fill="none" stroke="#173F42" stroke-width="3.2" stroke-linecap="round"></path><circle cx="36" cy="64" r="4" fill="#F4A58A" opacity="0.65"></circle><circle cx="64" cy="64" r="4" fill="#F4A58A" opacity="0.65"></circle><path d="M44 67 Q50 73 56 67" fill="none" stroke="#C9566B" stroke-width="3.2" stroke-linecap="round"></path></svg>
                  </sc-if>
                  <sc-if value="{{asstM}}" hint-placeholder-val="{{ false }}">
                  <svg width="104" height="104" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47" fill="#6C8CBF"></circle><path d="M14 97 C15 62 24 26 50 21 C76 26 85 62 86 97 Z" fill="#FFFFFF"></path><circle cx="50" cy="58" r="27" fill="#E3F4EF"></circle><path d="M22 41 C32 24 68 24 78 41" fill="none" stroke="#173F42" stroke-width="5" stroke-linecap="round"></path><path d="M25 47 C35 33 65 33 75 47" fill="none" stroke="#173F42" stroke-width="3.6" stroke-linecap="round"></path><path class="ruf-eye" d="M37 58 Q42 52 47 58M53 58 Q58 52 63 58" fill="none" stroke="#173F42" stroke-width="3.6" stroke-linecap="round"></path><path d="M43 68 Q50 74 57 68" fill="none" stroke="#173F42" stroke-width="3.2" stroke-linecap="round"></path><path d="M37 71 Q50 90 63 71" fill="none" stroke="#173F42" stroke-width="2.2" opacity="0.35"></path><path d="M30 93 Q50 100 70 93" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"></path></svg>
                  </sc-if>
                </span>
              </sc-if>
              <sc-if value="{{call.unknown}}" hint-placeholder-val="{{ false }}">
                <span style="position: absolute; inset: 0; border-radius: 52px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><img src="img/mark.png" alt="" style="width: 76px; height: 76px; display: block"></span>
              </sc-if>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
              <b style="font-family: 'Reem Kufi', sans-serif; font-size: 1.35em">{{call.who1}}</b>
              <sc-if value="{{call.known}}" hint-placeholder-val="{{ true }}">
                <span class="ruf-in" style="font-size: 0.72em; line-height: 1.6; color: #D9F2EB">{{call.heard}} <b>{{persona.detect}}</b></span>
              </sc-if>
              <sc-if value="{{call.speaking}}" hint-placeholder-val="{{ true }}">
                <span style="display: flex; align-items: center; gap: 3px; height: 18px" aria-hidden="true"><span class="ruf-bar"></span><span class="ruf-bar" style="animation-delay: .15s"></span><span class="ruf-bar" style="animation-delay: .3s"></span><span class="ruf-bar" style="animation-delay: .45s"></span><span class="ruf-bar" style="animation-delay: .6s"></span></span>
              </sc-if>
            </div>
          </div>

              <div class="ruf-in" style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 4px 0">
                <sc-for list="{{call.chips}}" as="ch" hint-placeholder-count="4">
                  <button onClick="{{ch.run}}" style="min-height: 44px; padding: 0 16px; border-radius: 14px; border: none; background: #FFFFFF; color: #173F42; font-weight: 600; font-size: 0.86em; cursor: pointer">{{ch.label}}</button>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{call.showCard}}" hint-placeholder-val="{{ false }}">
              <div class="ruf-in" style="background: #FFFFFF; color: #173F42; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
                <span style="font-size: 0.72em; font-weight: 700; color: #2F7F80">{{T.readyAppt}}</span>
                <b style="font-size: 1em">{{persona.test}}</b>
                <span style="font-size: 0.8em; color: #3A7C7D">{{call.when}} · {{persona.where}}</span>
                <span style="font-size: 0.74em; background: #E3F4EF; border-radius: 10px; padding: 6px 10px">{{persona.extra}}</span>
                <span style="font-size: 0.7em; color: #3A7C7D">{{call.cardHint}}</span>
                <div style="display: flex; gap: 8px">
                  <button onClick="{{call.confirm}}" style="flex: 1.3; min-height: 50px; border-radius: 14px; border: none; background: #2F7F80; color: #FFFFFF; font-weight: 600; cursor: pointer">{{call.confirmLabel}}</button>

<sc-if value="{{tr.show}}" hint-placeholder-val="{{ false }}">

                </sc-if>
                <span style="font-size: 0.68em; color: #5A7375">{{tr.note}}</span>

 · lolo (ina)", "High blood pressure usually has no symptoms. Catching it early protects your heart, kidneys and brain from avoidable complications.": "Kadalasang walang sintomas ang high blood pressure. Kapag maagang natukoy, napoprotektahan ang puso, bato at utak sa mga komplikasyong maiiwasan.", "Check your blood pressure at least yearly": "Magpasuri ng blood pressure kahit taun-taon", "Reduce salt and processed food": "Bawasan ang asin at processed food", "Free check at your neighborhood pharmacy": "Libreng check sa botika ng lugar", "1 in your family": "1 sa pamilya mo", "Your aunt · diagnosed in her forties": "Tiya mo · na-diagnose sa edad na 40+", "A close relative diagnosed young may mean your doctor advises starting screening earlier. Finding it early greatly improves treatment outcomes.": "Kapag maagang na-diagnose ang malapit na kamag-anak, maaaring payuhan ka ng doktor na magsimula ng screening nang mas maaga. Mas maganda ang resulta ng gamutan kapag maagang natuklasan.", "See a doctor to decide when to start screening": "Kumonsulta sa doktor kung kailan magsisimula ng screening", "Learn the monthly self-check": "Alamin ang buwanang self-check", "Rufaida books you with a female doctor": "Ibu-book ka ni Rufaida sa babaeng doktor", "You carry the trait": "May dala kang trait", "From your premarital test result": "Mula sa resulta ng premarital test mo", "Carrying the trait isn't a disease and doesn't affect your health, but if two carriers marry, their children may be affected. Knowing early protects the next generation.": "Hindi sakit ang pagdadala ng trait at hindi ito nakaaapekto sa kalusugan mo, pero kapag dalawang carrier ang ikinasal, maaaring maapektuhan ang mga anak. Napoprotektahan ng maagang pag-alam ang susunod na henerasyon.", "Premarital testing for your children": "Premarital test para sa mga anak mo", "Free genetic counseling at your local center": "Libreng genetic counseling sa lokal na center", "Before": "Bago", "The checkup": "Ang check-up       return `حيّك: ${this.home().name}.`;
    }
    openMaps(pt, mode) { if (pt) window.open(G.appleDir(this.home(), pt, mode || "w"), "_blank"); }

    /* ---------- location (asked with permission) ---------- */
    askLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve(false);
        this.setState({ loc: "locating" });
        navigator.geolocation.getCurrentPosition((pos) => {
          const lat = pos.coords.latitude, lng = pos.coords.longitude;
          let best = null, bd = 1e9; for (const d of DATA.riyadh || []) { const k = G.km(lat, lng, d.lat, d.lon); if (k < bd) { bd = k; best = d; } }
          const hood = best && bd < 8 ? { lat, lng, name: best.ar.replace(/^حي /, ""), pct: Math.round(best.completion * 100), gap: best.gap } : { lat, lng, name: "منطقتك", pct: null, gap: "" };
          LS.set("hood", hood); this.setState({ realHood: hood, loc: "found" }); this.loadPlaces(); resolve(true);
        }, () => { this.setState({ loc: "found" }); if (!this.places) this.loadPlaces(); resolve(false); }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 600000 });
      });
    }

    /* ---------- transport ---------- */
    makeTransport(option) {
      const h = this.home(); if (!this.places) this.places = G.localPlaces(h, PL);
      const c = this.places.center || G.fakeCenter(h);
      let tr, say;
      if (option === "uber") {
        const km = G.km(h.lat, h.lng, c.lat, c.lng), min = Math.max(6, Math.round((km / 28) * 60) + 4);
        tr = { option, km, min, dest: c.name, from: h.name, link: G.uberLink(h, c) };
        say = `جهّزت رحلة أوبر من ${h.name} إلى ${c.name}، حوالي ${min} دقيقة. اضغط «أكّد في أوبر» على الشاشة.`;
      } else {
        const plan = G.metroPlan(h, c, PL);
        if (!plan) { const d = G.km(h.lat, h.lng, c.lat, c.lng); return d < 2.5 ? `المركز قريب منك، ${G.walkMin(d)} دقيقة مشي. تحب أوبر بدال المشي؟` : "ما فيه محطة مترو قريبة منك، الأفضل أوبر أو العيادة المتنقلة."; }
        tr = { option, plan, dest: c.name, gmaps: G.transitLink(h, c) };
        say = `خطة المترو: امشِ ${plan.walk1} دقائق لمحطة ${plan.from.ar}، ثم ${plan.legs.map((l) => `${l.line.ar} ${l.stops} محطات`).join(" ثم ")}، وامشِ ${plan.walk2} دقائق للمركز. حوالي ${plan.total} دقيقة.`;
      }
      LS.set("tr", tr); this.setState({ tr, trSent: false });
      return say;
    }
    trVals() {
      const t = this.state.tr; if (!t) return { show: false };
      if (t.option === "uber") return { show: true, kicker: "Uber · رحلة جاهزة", title: `من ${t.from} إلى ${t.dest}`,
        lines: [{ color: "#BAC94A", text: "الاستلام قبل الموعد بـ 30 دقيقة" }, { color: "#6C8CBF", text: `حوالي ${t.min} دقيقة · ${G.fmtKm(t.km)}` }],
        href: t.link, cta: this.state.trSent ? "✓ أُرسلت لأوبر" : "أكّد في أوبر", ctaBg: "#000000", go: () => this.setState({ trSent: true }), has2: false,
        note: "يفتح تطبيق أوبر والرحلة معبّأة، والتأكيد النهائي يكون فيه." };
      const p = t.plan;
      return { show: true, kicker: "مترو الرياض · خطة كاملة", title: `${p.total} دقيقة إلى ${t.dest}`,
        lines: [{ color: "#96D7C6", text: `امشِ ${p.walk1} د إلى محطة ${p.from.ar}` }].concat(p.legs.map((l) => ({ color: l.line.color, text: `${l.line.ar} · ${l.stops} محطات إلى ${l.to.ar}` }))).concat([{ color: "#96D7C6", text: `امشِ ${p.walk2} د إلى ${t.dest}` }]),
        href: "https://apps.apple.com/sa/app/id1549817739", cta: "التذكرة في تطبيق «درب»", ctaBg: "#2F7F80", go: () => {}, has2: true, href2: t.gmaps, cta2: "الخطة في الخرائط",
        note: "محطات وخطوط مترو الرياض من بيانات الهيئة الملكية المفتوحة." };
    }

    /* ---------- the live agent ---------- */
    dyn(mode) {
      const v = this._v || {}, P = v.persona || {}, h = this.home(), t = (this.places || {}).trucks || [];
      const first = ((v.acct && v.acct.name) || "").split(" ")[0] || "";
      return {
        opening: mode === "call" ? this.opening() : `هلا ${first}! أنا ${this.asst().name}، معك في التطبيق. قول لي وش تبي، مثلًا: افتح دفتري، أو وين أقرب حديقة؟`,
        mode, user_name: first, test: P.test || "", slot_when: P.when || "", place: P.where || "", arranged: P.extra || "",
        appt_status: this.state.booked ? "مؤكد" : "بانتظار التأكيد",
        home_area: this.state.realHood ? h.name : `${h.name} (تقريبي، ما سمح بالموقع بعد)`,
        nearest_truck: t[0] ? `${t[0].name}، ${G.fmtKm(t[0].km)}، ${t[0].hours}` : "لا يوجد",
        family_history: this.familyText(), alt_slots: ALT_SLOTS,
      };
    }
    opening() {
      const v = this._v || {}, P = v.persona || {}, a = this.asst();
      if (this.state.persona === "rahim") return `السلام علیکم رحیم بھائی! میں وزارتِ صحت کے «عون» سے ${a === AG.f ? "رفیدہ" : "رفید"} بات کر رہی ہوں۔ آپ کا شوگر اور بلڈ پریشر کا مفت چیک اپ جمعہ صبح 10 بجے تیار ہے۔ کیا میں کنفرم کر دوں؟`;
      const name = ((v.acct && v.acct.name) || "").split(" ")[0];
      return `هلا والله${name ? " يا " + name : ""}! معك ${a.name} من «عون» التابع لوزارة الصحة. جهّزت لك موعد ${P.test} ${P.when} في ${P.where}. يناسبك نأكّده؟`;
    }
    tools(mode) {
      return {
        book_ready_appointment: async () => { this.confirmed(mode); return `booked: ${this._v.persona.test}, ${this._v.persona.when}`; },
        book_appointment: async ({ when, place, arrangement } = {}) => {
          const ov = { ...(this.state.ov || {}) }; if (when) ov.when = when; if (place) ov.where = place; if (arrangement) ov.extra = arrangement;
          LS.set("ov", ov); this.setState({ ov }); this.confirmed(mode, 12000); return `booked: ${ov.when || ""} ${ov.where || ""}`;
        },
        arrange_transport: async ({ option } = {}) => { if (!this.state.realHood) await this.askLocation(); return this.makeTransport(option === "metro" ? "metro" : "uber"); },
        show_on_map: async ({ place } = {}) => {
          if (!this.state.realHood) await this.askLocation();
          const kind = place === "mobile_clinic" ? "truck" : place === "health_center" ? "center" : place === "metro" ? "metro" : "park";
          this.setState({ nearKind: kind, ...(mode === "app" ? { screen: "home", voiceOpen: false } : {}) });
          return this.describe(place);
        },
        open_screen: async ({ screen } = {}) => {
          const m = { home: { screen: "home" }, notebook: { screen: "notebook", page: 0 }, family: { screen: "family" }, map: { screen: "home" }, settings: { screen: "access" }, appointment: { screen: "booked" } };
          this.setState({ ...(m[screen] || m.home), voiceOpen: false }); return "opened";
        },
        change_setting: async ({ setting, on } = {}) => {
          if (setting === "larger_text") this.setState({ large: true }); else if (setting === "smaller_text") this.setState({ large: false });
          else if (setting === "high_contrast") this.setState({ contrast: !!on });
          return "done";
        },
      };
    }
    async session(mode, cb) {
      const El = window.AounEL;
      const opts = (connectionType) => ({ agentId: this.asst().id, connectionType, dynamicVariables: this.dyn(mode), clientTools: this.tools(mode), ...cb });
      try { return await El.Conversation.startSession(opts("webrtc")); } catch (e) { return await El.Conversation.startSession(opts("websocket")); }
    }
    async mic() { try { const st = await navigator.mediaDevices.getUserMedia({ audio: true }); st.getTracks().forEach((t) => t.stop()); return true; } catch (e) { return false; } }

    /* ---------- the call ---------- */
    startCall() {
      this.stopCall();
      if (!this.places) this.loadPlaces();
      this.setState({ callStage: "live", callStep: 0, callSec: 0, callOk: false, callAlt: false, lv: [], lvPhase: "connecting", ov: null, tr: null, trSent: false });
      LS.set("ov", null); LS.set("tr", null);
      this.ctT = setInterval(() => this.setState({ callSec: this.state.callSec + 1 }), 1000);
      if (this.state.live) this.liveCall(); else this.offline();
    }
    async liveCall() {
      if (!(await this.mic())) { this.push("r", "اسمح للمايكروفون عشان نتكلم. أو أطفئ «الوكيل الحي» من الوصول وجرّب العرض بدون إنترنت."); return this.setState({ lvPhase: "offer" }); }
      try {
        this.conv = await this.session("call", {
          onConnect: () => this.setState({ lvPhase: "talking" }),
          onDisconnect: () => { this.conv = null; if (this.state.callStage === "live") this.endCall(!!this.state.callOk); },
          onModeChange: ({ mode }) => this.setState({ lvSpeaking: mode === "speaking" }),
          onMessage: (m) => { const t = (m.message || "").trim(); if (!t) return; this.push((m.role || (m.source === "ai" ? "agent" : "user")) === "agent" ? "r" : "u", t); if (this.state.lvPhase === "talking") this.setState({ lvPhase: "offer" }); },
          onError: (e) => console.warn("agent", e),
        });
      } catch (e) { this.push("r", "ما قدرنا نوصل للوكيل الحي الحين، كمّلنا بالعرض بدون إنترنت."); this.offline(true); }
    }
    push(who, text, sub) { this.setState({ lv: this.state.lv.concat([[who, text, sub || ""]]) }); }
    confirmed(mode, ms) {
      if (mode === "app") { this.setState({ booked: true }); return; }
      this.setState({ callOk: true, booked: true, lvPhase: "done" });
      clearTimeout(this.ceT); this.ceT = setTimeout(() => this.endCall(true), ms || 8000);
    }
    tapConfirm() {
      if (this.conv) { try { this.conv.sendUserMessage("إيه، أكّد الموعد."); } catch (e) {} this.confirmed("call", 9000); }
      else this.offConfirm();
    }
    tapDecline() {
      if (this.conv) { try { this.conv.sendUserMessage("لا، ما يناسبني."); } catch (e) {} this.setState({ lvPhase: "talking" }); setTimeout(() => this.state.lvPhase === "talking" && this.setState({ lvPhase: "offer" }), 6000); }
      else this.offDecline();
    }
    endConv() { const c = this.conv; this.conv = null; if (c) { try { c.endSession(); } catch (e) {} } }
    stopCall() { super.stopCall(); this.offCancel = true; this.endConv(); }
    endCall(ok) {
      super.endCall(ok);
      if (ok && !this.state.realHood) this.setState({ needLoc: true });
    }

    /* offline: same flow, phone voice */
    async say(who, text, sub) {
      if (this.offCancel) throw 0;
      this.push(who, text, sub);
      if (who === "r") {
        this.setState({ lvSpeaking: true });
        await new Promise((res) => { try { if (this.state.callMute || !this.state.callSpk) return setTimeout(res, 1200 + text.length * 40);
          const u = new SpeechSynthesisUtterance(text); u.lang = /[ٹڈڑںھہے]/.test(text) ? "ur-PK" : "ar-SA"; u.rate = 0.95; u.onend = u.onerror = res; speechSynthesis.speak(u); setTimeout(res, 2500 + text.length * 110); } catch (e) { res(); } });
        this.setState({ lvSpeaking: false });
      } else await wait(700 + text.length * 30);
      await wait(250);
    }
    async offline(already) {
      this.offCancel = false;
      try {
        if (!already) await this.say("u", this.state.persona === "rahim" ? "ہیلو؟" : "ألو؟", this.state.persona === "rahim" ? "ألو؟" : "");
        await this.say("r", this.opening(), this.state.persona === "rahim" ? "جهّزت لك فحص السكر والضغط الجمعة 10 الصبح. أأكّده؟" : "");
        this.setState({ lvPhase: "offer" });
      } catch (e) {}
    }
    async offConfirm() {
      try {
        this.setState({ lvPhase: "closing" }); await this.say("u", "إيه، أكّده الله يجزاك خير."); this.setState({ callOk: true, booked: true });
        await this.say("r", `تم! يوصلك تذكير قبلها بيوم، وأنا ${this.g("متابعة", "متابع")} معك لين يشوف الطبيب النتيجة.`);
        if (this.familyMetabolic()) await this.say("r", "وبما إن في عائلتك سكري أو ضغط، حطيت لك أقرب حديقة في التطبيق عشان مشي 20 دقيقة يوميًا.");
        this.setState({ lvPhase: "done" }); clearTimeout(this.ceT); this.ceT = setTimeout(() => this.endCall(true), 1800);
      } catch (e) {}
    }
    async offDecline() {
      try { this.setState({ lvPhase: "talking" }); await this.say("u", "لا، ما يناسبني."); await this.say("r", "ولا يهمك أبد. وش أكثر شي مصعّبها عليك؟"); this.setState({ lvPhase: "reasons" }); } catch (e) {}
    }
    async offReason(k, label) {
      try {
        this.setState({ lvPhase: "talking" }); await this.say("u", label);
        const t = (this.places || {}).trucks || [];
        if (k === "transport") { await this.say("r", `ولا يهمك! تحب أحجز لك أوبر من البيت للمركز، ولا أجهز لك خطة المترو؟${t[0] ? ` وفيه عيادة متنقلة ${G.fmtKm(t[0].km)} منك.` : ""}`); return this.setState({ lvPhase: "transport" }); }
        const S = { time: [{ when: "الثلاثاء 7:30 المسا", extra: "موعد مسائي بعد الدوام" }, "ولا يهمك، رتّبت لك موعد مسائي: الثلاثاء 7:30 المسا. يناسبك؟"],
          fear: [{ extra: "مع طبيبة هادئة · الفحص دقيقتين" }, "أفهمك، بس الفحص بسيط: نقطة دم ودقيقتين وتطمّن. رتّبت لك نفس الموعد مع طبيبة هادئة. يناسبك؟"],
          female: [{ when: "الأربعاء 10 الصبح", extra: "مع طبيبة" }, "أبشر، الأربعاء 10 الصبح مع طبيبة. يناسبك؟"] }[k];
        const ov = { ...(this.state.ov || {}), ...S[0] }; LS.set("ov", ov); this.setState({ ov });
        await this.say("r", S[1]); this.setState({ lvPhase: "offer" });
      } catch (e) {}
    }
    async offTransport(k, label) {
      try {
        this.setState({ lvPhase: "talking" }); await this.say("u", label);
        if (k === "truck") { const t = this.places.trucks[0]; const ov = { ...(this.state.ov || {}), where: t.name, when: t.when, extra: "قريبة من بيتك" }; LS.set("ov", ov); this.setState({ ov }); await this.say("r", `ممتاز، ${t.name}، ${G.fmtKm(t.km)} منك، ${t.when}. يناسبك؟`); return this.setState({ lvPhase: "offer" }); }
        if (!this.state.realHood) await this.askLocation();
        const msg = this.makeTransport(k); const ov = { ...(this.state.ov || {}), extra: k === "uber" ? "أوبر ذهاب وعودة" : "خطة المترو" }; LS.set("ov", ov); this.setState({ ov });
        await this.say("r", msg + " يناسبك نأكّد الموعد؟"); this.setState({ lvPhase: "offer" });
      } catch (e) {}
    }

    /* ---------- the assistant inside the app ---------- */
    async toggleApp() {
      if (this.appConv || this.state.appState === "connecting") { const c = this.appConv; this.appConv = null; this.setState({ appState: "off", caption: null }); if (c) { try { await c.endSession(); } catch (e) {} } return; }
      this.setState({ appState: "connecting", voiceOpen: false });
      if (!(await this.mic())) { this.setState({ appState: "off", caption: "اسمح للمايكروفون عشان تكلّم " + this.asst().name }); return; }
      try {
        this.appConv = await this.session("app", {
          onConnect: () => this.setState({ appState: "listening" }),
          onDisconnect: () => { this.appConv = null; this.setState({ appState: "off" }); },
          onModeChange: ({ mode }) => this.setState({ appState: mode === "speaking" ? "speaking" : "listening" }),
          onMessage: (m) => { if ((m.role || (m.source === "ai" ? "agent" : "user")) === "agent") { clearTimeout(this.capT); this.setState({ caption: m.message }); this.capT = setTimeout(() => this.setState({ caption: null }), 7000); } },
          onError: (e) => console.warn("app agent", e),
        });
      } catch (e) { this.setState({ appState: "off", caption: "ما قدرنا نوصل لـ" + this.asst().name + " الحين." }); }
    }

    /* ---------- values for the design ---------- */
    renderVals() {
      const v = super.renderVals(); this._v = v;
      const s = this.state, self = this;
      if (s.ov) v.persona = { ...v.persona, ...(s.ov.when ? { when: s.ov.when } : {}), ...(s.ov.where ? { where: s.ov.where } : {}), ...(s.ov.extra ? { extra: s.ov.extra } : {}) };

      // the call
      const c = v.call;
      if (c.live) {
        c.msgs = s.lv.map((m) => ({ text: m[1], sub: m[2], hasSub: !!m[2], who: m[0] === "u" ? "أنت" : this.asst().name,
          justify: m[0] === "u" ? "flex-start" : "flex-end", bg: m[0] === "u" ? "rgba(255,255,255,.14)" : "#FFFFFF", color: m[0] === "u" ? "#FFFFFF" : "#173F42" })).reverse();
        c.known = s.lv.some((m) => m[0] === "r"); c.unknown = !c.known; c.who1 = c.known ? this.asst().name : "عون";
        c.speaking = !!s.lvSpeaking; c.when = v.persona.when;
        c.showCard = !s.callOk && s.lvPhase === "offer"; c.canAlt = true; c.altLabel = "ما يناسبني"; c.confirmLabel = "أكّد الموعد";
        c.confirm = () => this.tapConfirm(); c.alt = () => this.tapDecline();
        c.endedNote = !!s.callOk && s.lvPhase === "done";
        c.hasChips = !this.conv && (s.lvPhase === "reasons" || s.lvPhase === "transport");
        const trucks = (this.places || {}).trucks || [];
        c.chips = s.lvPhase === "reasons" ? REASONS.map(([k, l]) => ({ label: l, run: () => this.offReason(k, l) }))
          : [["uber", "أوبر"], ["metro", "المترو"]].concat(trucks[0] ? [["truck", "العيادة المتنقلة"]] : []).map(([k, l]) => ({ label: l, run: () => this.offTransport(k, l) }));
        c.ctrls = (c.ctrls || []).slice(0, 2);
        if (c.ctrls[0]) c.ctrls[0].run = () => { const on = !s.callMute; try { speechSynthesis.cancel(); this.conv && this.conv.setMicMuted(on); } catch (e) {} this.setState({ callMute: on }); };
        if (c.ctrls[1]) c.ctrls[1].run = () => { const on = !s.callSpk; try { speechSynthesis.cancel(); this.conv && this.conv.setVolume({ volume: on ? 1 : 0 }); } catch (e) {} this.setState({ callSpk: on }); };
        c.hang = () => this.endCall(!!s.callOk);
      }
      v.tr = this.trVals();

      // the neighborhood (real when location is allowed)
      const h = this.home();
      if (s.realHood) v.myHood = { ...v.myHood, name: h.name, city: "الرياض", pct: h.pct == null ? v.myHood.pct : h.pct, pctW: (h.pct == null ? v.myHood.pct : h.pct) + "%", gap: h.gap || v.myHood.gap };
      v.allowLoc = () => this.askLocation();
      v.startAgent = () => this.setState({ screen: "home" });
      const p = this.places;
      if (p) {
        const kind = s.nearKind || (this.familyMetabolic() ? "park" : (p.trucks[0] ? "truck" : "park"));
        const pt = kind === "truck" ? p.trucks[0] : kind === "center" ? p.center : kind === "metro" ? p.stations[0] : p.parks[0];
        if (pt) {
          const nm = pt.name || pt.ar, km = pt.km;
          v.near = { ...v.near, place: nm,
            title: kind === "park" ? `مشي 20 دقيقة في ${nm}` : kind === "truck" ? "عيادة فحص متنقلة قريبة منك" : kind === "metro" ? `أقرب محطة مترو: ${nm}` : `مركزك الصحي: ${nm}`,
            why: kind === "park" ? (this.familyMetabolic() ? "لأن في عائلتك سكري أو ضغط، المشي اليومي يحميك. هذي أقرب حديقة لبيتك." : "أقرب حديقة لبيتك، ومشي يومي بسيط يفرق كثير.") : kind === "truck" ? "افحص بدون مشوار طويل وبدون إجازة." : "",
            walk: `${G.walkMin(km)} دقيقة مشي · ${G.fmtKm(km)}`, when: kind === "truck" ? pt.hours : kind === "park" ? "الأفضل الصبح أو بعد العصر" : "",
            go: () => this.openMaps(pt, kind === "center" ? "d" : "w") };
        }
      } else v.near = { ...v.near, go: () => window.open("https://maps.apple.com/?q=" + encodeURIComponent((v.near.place || "") + " " + (v.myHood.name || "")), "_blank") };

      // ask for the location after booking, before entering the app
      const goHome = v.goHome;
      v.goHome = () => { if (!s.realHood && s.screen === "booked") this.setState({ screen: "locate", loc: "ask" }); else goHome(); };
